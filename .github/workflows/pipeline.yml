name: Spice Garden Shorts Pipeline

# Build-only pipeline. The creative script (dish + village story + the six
# hero-clip prompts) is authored by Claude on demand and committed under
# clip-pool/pending/<date>-<slot>/; the human then generates the clips in Omni
# and drops them into clip-pool/incoming/. This workflow just BUILDS every
# fulfilled request into a review video (run_stage_bc.py builds all ready
# slots), where Gemini writes only the title + description. It NEVER uploads -
# publishing is the separate approve-upload.yml, run after a human review.
#
# Runs twice a day as a safety net so dropped clips get built even without a
# manual trigger; trigger it by hand any time after pushing clips.
on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "30 12 * * *"  # 6:00 PM IST
  workflow_dispatch: {}

jobs:
  produce-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build every ready clip-pool request (stops for review)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # title/description only
        run: python scripts/run_stage_bc.py

      - name: Check Flow credit budget
        if: always()
        run: python scripts/check_credit_budget.py

      - name: Upload run artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 7

      - name: Commit clip-pool, review-pending, and usage-log changes
        if: always()
        run: |
          git config user.name "spice-garden-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cost_logs/usage.csv clip-pool/ review-pending/
          git diff --staged --quiet || git commit -m "chore: build review videos + usage log [skip ci]"
          git push
